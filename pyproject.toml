[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "fastnda"
version = "1.3.0"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
description = "Read Neware nda and ndax files fast."
dependencies = [
    "defusedxml>=0.7.1",
    "isal; platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'aarch64'",
    "numpy>=2.2.6",
    "polars>=1.33.1",
    "tqdm>=4.67.1",
    "typer>=0.20.0",
    "xmltodict>=1.0.2",
]

[project.optional-dependencies]
extras = [
    "pandas>=2.3.1",
    "pyarrow>=23.0.0",
    "tables>=3.11.0; python_version >= '3.11'",
    "tables>=3.10.0,<3.11.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "fastnda[extras]",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
]

[project.scripts]
fastnda = "fastnda.cli:app"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120
lint.select = ["ALL"]
lint.ignore = [
    "N806",  # upper case allowed in variables, used for units
    "PLR2004",  # magic value comparisons, used everywhere for version numbers
    "COM812",  # conflicts with ruff format
    "PLC0415",  # top-level imports - we use lazy imports frequently
]
fix = true

[tool.ruff.lint.extend-per-file-ignores]
"tests/*.py" = [
    "S101", # asserts allowed in tests
    "PT011", # allow just checking for ValueError without match
    "SLF001", # unit tests intentionally reach into private _read_nda_x internals
]

[tool.pytest.ini_options]
addopts = "-rxX"
